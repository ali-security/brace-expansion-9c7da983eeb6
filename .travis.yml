sudo: false
dist: focal
arch:
 - amd64
language: node_js
node_js:
  - "22"
  - "10"
  - "12"
  - "14"
script:
  - NODE_MAJOR=$(node -e 'console.log(process.versions.node.split(".")[0])')
  - |
    if [ "$NODE_MAJOR" -ge 22 ]; then
      npm test
    else
      node node_modules/.bin/tape test/bash-comparison.js test/dollar.js test/empty-option.js test/negative-increment.js test/nested.js test/order.js test/pad.js test/same-type.js test/sequence.js
    fi
